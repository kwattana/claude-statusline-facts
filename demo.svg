<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <style>
    .bg { fill: #1e1e1e; }
    .text { font-family: 'Monaco', 'Menlo', 'Courier New', monospace; font-size: 14px; }
    .cyan { fill: #00d7d7; }
    .dim { fill: #888888; }
    .emoji { font-size: 16px; }
    .prompt { fill: #00ff00; }
    .title { fill: #ffffff; font-weight: bold; }

    @keyframes fact1 { 0%, 20% { opacity: 1; } 21%, 100% { opacity: 0; } }
    @keyframes fact2 { 0%, 20% { opacity: 0; } 21%, 40% { opacity: 1; } 41%, 100% { opacity: 0; } }
    @keyframes fact3 { 0%, 40% { opacity: 0; } 41%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
    @keyframes fact4 { 0%, 60% { opacity: 0; } 61%, 80% { opacity: 1; } 81%, 100% { opacity: 0; } }
    @keyframes fact5 { 0%, 80% { opacity: 0; } 81%, 100% { opacity: 1; } }

    .f1 { animation: fact1 10s infinite; }
    .f2 { animation: fact2 10s infinite; }
    .f3 { animation: fact3 10s infinite; }
    .f4 { animation: fact4 10s infinite; }
    .f5 { animation: fact5 10s infinite; }
  </style>

  <!-- Background -->
  <rect class="bg" width="800" height="200" rx="8"/>

  <!-- Terminal header -->
  <rect fill="#323232" width="800" height="32" rx="8"/>
  <rect fill="#1e1e1e" y="24" width="800" height="8"/>
  <circle fill="#ff5f56" cx="20" cy="16" r="6"/>
  <circle fill="#ffbd2e" cx="40" cy="16" r="6"/>
  <circle fill="#27ca40" cx="60" cy="16" r="6"/>
  <text x="400" y="20" text-anchor="middle" class="text title">Claude Code</text>

  <!-- Prompt line -->
  <text x="20" y="70" class="text prompt">❯</text>
  <text x="40" y="70" class="text dim">claude "explain this code"</text>

  <!-- Thinking indicator -->
  <text x="20" y="110" class="text cyan">● Thinking...</text>

  <!-- Status line facts (animated) -->
  <g class="f1">
    <text x="20" y="150" class="text">
      <tspan class="emoji">🐾</tspan>
      <tspan class="cyan" font-weight="bold"> Did you know?</tspan>
      <tspan class="dim"> Sea otters hold hands while sleeping to keep from drifting apart.</tspan>
    </text>
  </g>

  <g class="f2">
    <text x="20" y="150" class="text">
      <tspan class="emoji">🚀</tspan>
      <tspan class="cyan" font-weight="bold"> Did you know?</tspan>
      <tspan class="dim"> Saturn would float if you could find a bathtub big enough.</tspan>
    </text>
  </g>

  <g class="f3">
    <text x="20" y="150" class="text">
      <tspan class="emoji">🤖</tspan>
      <tspan class="cyan" font-weight="bold"> Did you know?</tspan>
      <tspan class="dim"> Claude is named after Claude Shannon, the father of information theory.</tspan>
    </text>
  </g>

  <g class="f4">
    <text x="20" y="150" class="text">
      <tspan class="emoji">🦄</tspan>
      <tspan class="cyan" font-weight="bold"> Did you know?</tspan>
      <tspan class="dim"> Airbnb started when founders rented air mattresses in their apartment.</tspan>
    </text>
  </g>

  <g class="f5">
    <text x="20" y="150" class="text">
      <tspan class="emoji">💪</tspan>
      <tspan class="cyan" font-weight="bold"> Did you know?</tspan>
      <tspan class="dim"> HRV is one of the best indicators of overall health and recovery.</tspan>
    </text>
  </g>

  <!-- Footer -->
  <text x="20" y="180" class="text dim" font-size="11">Facts rotate every 5 seconds • 1000+ facts • 20 categories</text>
</svg>